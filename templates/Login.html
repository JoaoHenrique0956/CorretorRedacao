
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login - Corretor de Redações</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root{
            --purple-50:#EEEDFE;
            --purple-100:#CECBF6;
            --purple-400:#7F77DD;
            --purple-600:#534AB7;
            --purple-800:#3C3489;
            --purple-900:#26215C;
        }

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            min-height:100vh;
            background:#f0efe8;
            font-family:'DM Sans',sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .login-card{
            width:100%;
            max-width:420px;
            background:#fffffe;
            border:1px solid #e2e0d8;
            border-radius:20px;
            padding:40px;
            box-shadow:0 10px 30px rgba(0,0,0,.05);
        }

        .logo-box{
            width:70px;
            height:70px;
            margin:auto;
            background:var(--purple-900);
            border-radius:16px;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            margin-bottom:20px;
        }

        .logo-box img{
            width:50px;
            height:50px;
            object-fit:contain;
        }

        .titulo{
            font-family:'Lora',serif;
            font-size:28px;
            font-weight:600;
            color:var(--purple-900);
            text-align:center;
            margin-bottom:6px;
        }

        .subtitulo{
            text-align:center;
            color:#888780;
            font-size:14px;
            margin-bottom:30px;
        }

        .form-floating{
            margin-bottom:16px;
        }

        .form-control{
            border:1.5px solid #dbd9d0;
            border-radius:12px !important;
            background:#fffffe;
        }

        .form-control:focus{
            border-color:var(--purple-400);
            box-shadow:0 0 0 3px rgba(127,119,221,.12);
        }

        .btn-login{
            width:100%;
            border:none;
            border-radius:12px;
            background:var(--purple-900);
            color:white;
            padding:14px;
            font-size:15px;
            font-weight:500;
            transition:.2s;
        }

        .btn-login:hover{
            background:var(--purple-800);
            transform:translateY(-1px);
        }

        .footer-text{
            margin-top:20px;
            text-align:center;
            color:#888780;
            font-size:13px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo-box">
            <img src="static/uploads/images/Logo.png" alt="Logo">
        </div>

        <h1 class="titulo">Corretor de Redações</h1>
        <p class="subtitulo">
            Plataforma inteligente de correção textual
        </p>

        {% if erro %}<div class="alert alert-danger" role="alert">{{ erro }}</div>{% endif %}

<div class="d-flex gap-2 mb-4">

    <a href="/" class="btn btn-outline-secondary flex-fill">
        Voltar
    </a>

    <button
        type="button"
        id="toggleCadastro"
        class="btn btn-outline-primary flex-fill">
        Criar conta
    </button>

</div>

<!-- LOGIN -->
<form id="loginForm" method="post">

    <div class="form-floating">
        <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            value="{{ email or '' }}"
            placeholder="Email"
            required>
        <label>Email</label>
    </div>

    <div class="form-floating">
        <input
            type="password"
            class="form-control"
            id="senha"
            name="senha"
            placeholder="Senha"
            required>
        <label>Senha</label>
    </div>

    <button class="btn-login" type="submit">
        Entrar
    </button>

    </form>

    <!-- CADASTRO -->
    <form id="cadastroForm" method="post" action="/cadastro" style="display:none;">

        <div class="form-floating">
            <input
                type="text"
                class="form-control"
                name="nome"
                placeholder="Nome"
                required>
            <label>Nome</label>
        </div>

        <div class="form-floating">
            <input
                type="email"
                class="form-control"
                name="email"
                placeholder="Email"
                required>
            <label>Email</label>
        </div>

        <div class="form-floating">
            <input
                type="password"
                class="form-control"
                name="senha"
                placeholder="Senha"
                required>
            <label>Senha</label>
        </div>

        <button class="btn-login" type="submit">
            Criar Conta
        </button>

    </form>

            <div class="footer-text">
                Corretor de Redações © 2026
            </div>

        </div>

</body>
</html>

<script>

const btnToggle = document.getElementById("toggleCadastro");
const loginForm = document.getElementById("loginForm");
const cadastroForm = document.getElementById("cadastroForm");

btnToggle.addEventListener("click", () => {

    const cadastroAberto =
        cadastroForm.style.display === "block";

    if(cadastroAberto){

        cadastroForm.style.display = "none";
        loginForm.style.display = "block";

        btnToggle.textContent = "Criar conta";

        document.querySelector(".titulo").textContent =
            "Corretor de Redações";

    }else{

        cadastroForm.style.display = "block";
        loginForm.style.display = "none";

        btnToggle.textContent = "Fazer login";

        document.querySelector(".titulo").textContent =
            "Criar Conta";
    }
});

</script>
