
<!doctype html><html lang="pt-br"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redações-modelo</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>body{background:#f7f6f1;color:#29283a}.page{max-width:1100px;margin:auto;padding:28px}.card{border:1px solid #e2e0d8;border-radius:14px}.brand{color:#26215c}.sample-text{white-space:pre-wrap;font-family:Georgia,serif;line-height:1.8}.note{background:#26215c;color:white;border-radius:14px;padding:18px}.mark{background:#ffe08a}#detalhe{display:none}.feedback{border-bottom:1px solid #eee;padding:10px 0}</style></head><body>
<main class="page"><header class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="brand">Redações-modelo</h1><p class="text-secondary">Exemplos comentados para consultar os critérios de correção.</p></div><a href="/" class="btn btn-outline-primary">Voltar ao corretor</a></header>
{% if modelos %}<div class="row g-3">{% for item in modelos %}<div class="col-md-6"><button class="card p-4 text-start w-100 h-100" onclick="abrir({{ loop.index0 }})"><div class="d-flex justify-content-between gap-2"><h2 class="h5 brand">{{ item.titulo }}</h2><span class="badge text-bg-light">{{ item.genero }}</span></div><p class="text-secondary">Tema: {{ item.tema or 'Livre' }}</p><p class="mb-2">Nota {{ '%.1f'|format(item.nota or 0) }} · {{ item.nivel }}</p><span class="text-primary">Ver redação e correção <i class="bi bi-arrow-right"></i></span></button></div>{% endfor %}</div>{% else %}<div class="card p-5 text-center">Nenhuma redação-modelo cadastrada.</div>{% endif %}
<section id="detalhe" class="card p-4 mt-4"><div class="d-flex justify-content-between align-items-start"><div><h2 id="titulo" class="brand h3"></h2><p id="meta" class="text-secondary"></p></div><button class="btn-close" onclick="document.getElementById('detalhe').style.display='none'"></button></div><div class="row g-3"><article class="col-lg-7"><div class="note mb-3"><small>Nota geral</small><div id="nota" class="display-5"></div><span id="nivel"></span></div><h3 class="h5">Redação</h3><div id="texto" class="sample-text"></div></article><aside class="col-lg-5"><h3 class="h5">Critérios e comentários</h3><div id="feedback"></div></aside></div></section></main>
<script>const modelos={{ modelos|tojson }};function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function abrir(i){const m=modelos[i];document.getElementById('detalhe').style.display='block';document.getElementById('titulo').textContent=m.titulo;document.getElementById('meta').textContent=(m.genero||'')+' · Tema: '+(m.tema||'Livre');document.getElementById('nota').textContent=Number(m.nota||0).toFixed(1);document.getElementById('nivel').textContent=m.nivel;document.getElementById('texto').textContent=m.conteudo||'';const f=m.feedback||{};const rows=[['Estrutura',f.txtStruct,m.nEstrutura],['Tema',f.txtTema,m.nTema],['Gramática',f.txtGeC,m.nGramatica],['Repertório',f.txtRep,m.nRepertorio],['Coesão',f.txtCoe,m.nCoesao],['Recomendações',f.txtTip,'']];document.getElementById('feedback').innerHTML=rows.map(r=>`<div class="feedback"><strong>${r[0]} ${r[2]!==''?'· '+Number(r[2]||0).toFixed(1)+'/10':''}</strong><div>${esc(r[1]||'Sem comentário informado.')}</div></div>`).join('');document.getElementById('detalhe').scrollIntoView({behavior:'smooth'});}</script></body></html>
